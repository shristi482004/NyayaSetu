version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nyayasetu-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - nyayasetu-network

  ai-service:
    build:
      context: ./src/ai_service
      dockerfile: Dockerfile
    container_name: nyayasetu-ai-service
    restart: on-failure
    environment:
      - AI_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - nyayasetu-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: nyayasetu-backend
    restart: on-failure
    depends_on:
      - mongodb
      - ai-service
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/nyayasetu
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY}
    ports:
      - "5000:5000"
    networks:
      - nyayasetu-network

networks:
  nyayasetu-network:
    driver: bridge

volumes:
  mongo_data:

